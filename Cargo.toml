[package]
name = "glance"
version = "0.1.0"
edition = "2024"

[dependencies]
arboard = "3.7.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
eframe = { version = "0.37.0", features = ["persistence", "glow"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "tiff", "ico"] }
kamadak-exif = "0.6.2"
qrcode = { version = "0.15.0", default-features = false }
raw-window-handle = "0.6"
resvg = "0.50.0"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
trash = "5.4.0"

[build-dependencies]
winresource = "0.1.34"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_Controls", "Win32_Graphics_Imaging", "Win32_Media_MediaFoundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_Storage_EnhancedStorage", "Win32_System_Ole", "Win32_System_Registry", "Win32_System_SystemServices", "Win32_UI_Shell_Common", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging"] }
windows-core = "0.62"

[profile.release]
strip = true # smaller download; no debug symbols in releases
