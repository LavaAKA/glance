<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Send to Glance</title>
<style>
  :root { color-scheme: light dark; --accent: #2f6fd8; --bg: #f4f4f4; --card: #fff; --line: #ddd; --weak: #666; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1e1e1e; --card: #2a2a2a; --line: #3a3a3a; --weak: #9a9a9a; } }
  body { margin: 0; font: 16px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); }
  main { max-width: 520px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font-size: 20px; margin: 4px 0 2px; }
  p { margin: 0 0 16px; color: var(--weak); font-size: 14px; }
  label.pick { display: block; text-align: center; background: var(--accent); color: #fff; border-radius: 6px; padding: 14px; font-weight: 600; }
  input[type=file] { display: none; }
  ul { list-style: none; padding: 0; margin: 16px 0 0; }
  li { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; margin-bottom: 8px; font-size: 14px; }
  .row { display: flex; justify-content: space-between; gap: 8px; }
  .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .state { color: var(--weak); flex: none; }
  .bar { height: 3px; background: var(--line); border-radius: 2px; margin-top: 8px; overflow: hidden; }
  .bar div { height: 100%; width: 0; background: var(--accent); }
  .done .state { color: #2e9e4f; } .done .bar div { background: #2e9e4f; }
  .fail .state { color: #d0453a; } .fail .bar div { background: #d0453a; }
  #summary { margin-top: 12px; font-size: 14px; color: var(--weak); }
</style>
</head>
<body>
<main>
  <h1>Send to Glance</h1>
  <p>Photos and videos go straight to your PC. Keep this page open until they finish.</p>
  <label class="pick">Choose photos and videos<input id="files" type="file" multiple accept="image/*,video/*"></label>
  <div id="summary"></div>
  <ul id="list"></ul>
</main>
<script>
  const pass = "__PASS__"; // this phone's own pass, filled in by Glance
  history.replaceState(null, "", "/?t=" + pass); // a reload keeps working after the QR code changes
  const code = pass;
  const list = document.getElementById("list"), summary = document.getElementById("summary");
  const queue = []; let busy = false, sent = 0, failed = 0;
  const size = n => n > 1e9 ? (n / 1e9).toFixed(1) + " GB" : n > 1e6 ? (n / 1e6).toFixed(1) + " MB" : Math.ceil(n / 1e3) + " KB";

  document.getElementById("files").addEventListener("change", e => {
    for (const file of e.target.files) {
      const li = document.createElement("li");
      li.innerHTML = '<div class="row"><span class="name"></span><span class="state">Waiting</span></div><div class="bar"><div></div></div>';
      li.querySelector(".name").textContent = file.name;
      list.appendChild(li);
      queue.push({ file, li });
    }
    e.target.value = "";
    next();
  });

  function next() {
    summary.textContent = queue.length || busy ? `Sending… ${sent} done, ${queue.length + (busy ? 1 : 0)} to go` : sent || failed ? `${sent} sent` + (failed ? `, ${failed} failed` : "") : "";
    if (busy || !queue.length) return;
    busy = true;
    const { file, li } = queue.shift();
    const state = li.querySelector(".state"), bar = li.querySelector(".bar div");
    const xhr = new XMLHttpRequest();
    xhr.open("POST", `/upload?t=${encodeURIComponent(code)}&name=${encodeURIComponent(file.name)}`);
    xhr.upload.onprogress = e => {
      if (!e.lengthComputable) return;
      bar.style.width = (e.loaded / e.total * 100) + "%";
      state.textContent = `${size(e.loaded)} of ${size(e.total)}`;
    };
    const finish = (ok, why) => {
      li.className = ok ? "done" : "fail";
      bar.style.width = "100%";
      state.textContent = ok ? "Sent" : why;
      ok ? sent++ : failed++;
      busy = false;
      next();
    };
    xhr.onload = () => xhr.status === 200 ? finish(true) : finish(false, xhr.status === 403 ? "Glance closed the window" : "Not sent");
    xhr.onerror = () => finish(false, "Couldn't reach the PC");
    xhr.send(file);
    state.textContent = "Sending";
    summary.textContent = `Sending… ${sent} done, ${queue.length + 1} to go`;
  }
</script>
</body>
</html>
